workflows:
  android-workflow:
    name: Sultan Voice Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 2.10.5
    triggering:
      events:
        - push
    scripts:
      - name: Fetching app sources
        script: |
          echo "Sources fetched successfully"
      - name: Build Android APK
        script: |
          cd sultan_voic_app
          flutter build apk --release
