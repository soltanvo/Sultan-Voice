workflows:
  android-workflow:
    name: Sultan Voice Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: stable
    triggering:
      events:
        - push
    scripts:
      - name: Fetching app sources
        script: |
          echo "Sources fetched successfully"
      - name: Build Android APK
        script: |
          flutter build apk --release
